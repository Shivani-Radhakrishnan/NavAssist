name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    name: NavAssistCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        working-directory: ios/NavAssistCore
        run: swift test

  android-core:
    name: Android core tests (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run tests
        working-directory: android
        run: ./gradlew :core:test --console=plain
